[build]
  command = "npm run build --workspace @coursemate/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24.14.0"

# Configure VITE_CLERK_PUBLISHABLE_KEY, VITE_RAG_API_URL, VITE_AGENT_API_URL,
# VITE_UI_API_BASE and VITE_V3_ENABLED in the Netlify UI. Keep V3 false until the
# gated canary. Never place Clerk secret keys here.

# The refreshed CourseMate shell is a second document in the same build. It is
# served under /app so it cannot fight the existing site over global styles.
[[redirects]]
  from = "/app"
  to = "/ui.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/ui.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
