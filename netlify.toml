[build]
  command = "npm run build --workspace @coursemate/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24.14.0"

# Configure VITE_CLERK_PUBLISHABLE_KEY, VITE_RAG_API_URL, and
# VITE_AGENT_API_URL in the Netlify UI. Never place Clerk secret keys here.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
