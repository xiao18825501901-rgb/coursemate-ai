[project]
name = "coursemate-rag-api"
version = "0.1.0"
description = "Transparent hybrid-retrieval API for CourseMate AI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["golden: tests against the local read-only real CourseMate corpus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
