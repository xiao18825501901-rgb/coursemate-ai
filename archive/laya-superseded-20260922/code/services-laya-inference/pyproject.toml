[project]
name = "coursemate-laya-inference"
version = "0.1.0"
description = "Private, single-model Laya multilingual decision service for CourseMate."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
